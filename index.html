<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Tráfico Aéreo</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- Mapa Central -->
        <div id="map"></div>

        <!-- Capa de UI sobre el mapa -->
        <div id="dashboard">
            
            <!-- Barra superior -->
            <header class="top-bar glass-panel">
                <div class="logo">
                    <span class="pulse-indicator"></span>
                    <h1>RADAR AÉREO LIVE</h1>
                </div>
                <div class="status-indicator">
                    <button id="toggle-orchestra" class="audio-btn on">🎵 Orquesta General</button>
                    <button id="toggle-audio" class="audio-btn off">🔇 Audio Inactivo</button>
                    <span id="data-mode" class="status-badge mode-real">DATOS REALES</span>
                    <span id="ws-status" class="status-badge online">BARRIDO RADAR ACTIVO</span>
                </div>
            </header>

            <!-- KPIs Flotantes (en flujo normal debajo de la barra superior) -->
            <div class="kpi-panel glass-panel">
                <div class="kpi-card">
                    <span class="kpi-label">VUELOS ACTIVOS</span>
                    <span class="kpi-value highlight" id="kpi-count">0</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-label">VEL. PROMEDIO (KM/H)</span>
                    <span class="kpi-value" id="kpi-speed">0.0</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-label">HORA ZULU</span>
                    <span class="kpi-value time-value" id="kpi-time">--:--:--</span>
                </div>
            </div>

            <!-- Terminal Flotante en la esquina inferior izquierda -->
            <div class="event-feed glass-panel">
                <div class="feed-header">
                    <span>VHF FEED / SYSTEM LOG</span>
                    <button id="clear-feed">CLEAR</button>
                </div>
                <div id="console-output" class="console-body">
                    <div class="log-entry system"><span class="timestamp">[SYS]</span> Iniciando sistemas de radar aéreo...</div>
                </div>
            </div>

            <!-- Panel de Detalles Flotante en la derecha (Oculto por defecto) -->
            <aside id="vessel-details" class="details-panel glass-panel hidden">
                <div class="details-header">
                    <h2>VUELO: <span id="det-name" class="highlight">---</span></h2>
                    <button id="close-details">×</button>
                </div>
                <div class="details-content">
                    <div class="detail-row"><span>CALLSIGN:</span> <span id="det-mmsi">---</span></div>
                    <div class="detail-row"><span>ESTADO:</span> <span id="det-status">---</span></div>
                    <div class="detail-row"><span>ORIGEN:</span> <span id="det-dest">---</span></div>
                    <div class="detail-row"><span>ALTITUD:</span> <span id="det-alt">---</span> m</div>
                    <div class="detail-row"><span>VELOCIDAD:</span> <span id="det-spd">---</span></div>
                    <div class="detail-row"><span>RUMBO:</span> <span id="det-cog">---</span></div>
                </div>
            </aside>

        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Main JS -->
    <script src="app.js"></script>
</body>
</html>
